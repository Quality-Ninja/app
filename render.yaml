# Render Blueprint for the QA Ninja web app: a static site that Vite builds into dist/.
# Keep the rewrites and headers in sync with serve.js, which npm start and the browser tests use.
services:
  - type: web
    name: qaninja-app
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: ./dist
    envVars:
      # Public build settings (see .env.example). Set them in the Render dashboard.
      - key: API_BASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_FRONTEND_API
        sync: false
      - key: EXTENSION_ID
        sync: false
      - key: APP_ENV
        value: production
    # The app is one page (index.html); its router shows each of these paths, which the extension, Stripe, OpenRouter
    # (/execute/connect/openrouter) and coding agents (/execute/runs/*) link to.
    # There is deliberately no /* catch-all: any other path is a real 404, served from 404.html (the same page, which
    # shows "Page not found").
    routes:
      - type: rewrite
        source: /sign-in
        destination: /index.html
      - type: rewrite
        source: /account
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
      - type: rewrite
        source: /workflow/*
        destination: /index.html
      - type: rewrite
        source: /execute
        destination: /index.html
      - type: rewrite
        source: /execute/runs/*
        destination: /index.html
      - type: rewrite
        source: /execute/connect/openrouter
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # The rest of the policy is a meta tag in the page, built from the configured origins.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      # Vite names every file under /assets/ by its content, so they can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
